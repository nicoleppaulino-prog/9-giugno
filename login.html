<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpiShop — Accedi</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body>

    <header class="bg-primary text-white py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="fs-3 m-0"><a href="index.html" class="text-white text-decoration-none">EpiShop</a></h1>
        <nav>
          <a class="text-white text-decoration-none mx-2" href="index.html#prodotti">Prodotti</a>
          <a class="text-white text-decoration-none mx-2" href="#">Offerte</a>
          <a class="text-white text-decoration-none mx-2 d-none d-md-inline" href="#">Contatti</a>
        </nav>
      </div>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">

          <div class="border rounded p-4 bg-white shadow-sm">
            <h2 class="fs-4 fw-bold mb-4 text-center">Accedi al tuo account</h2>

            <form>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="email"
                       placeholder="nome@esempio.it" required>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password"
                       placeholder="••••••••" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Accedi</button>
              </div>
            </form>

            <hr class="my-4">

            <p class="text-center text-muted m-0 small">
              Non hai un account?
              <a href="register.html" class="text-primary text-decoration-none">Registrati</a>
            </p>
          </div>

        </div>
      </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p class="m-0">© 2026 EpiShop — tutti i diritti riservati</p>
      </div>
    </footer>

  </body>
</html>
